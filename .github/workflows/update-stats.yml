name: Update stats

on:
  schedule:
    # 10:15 UTC = 6:15 AM Eastern (5:15 AM in winter), after every game has finished
    - cron: "15 10 * * *"
  workflow_dispatch: # adds a "Run workflow" button so you can update on demand

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # always start from the newest version of the site

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pull the latest NHL stats
        run: python scripts/fetch_stats.py

      - name: Save the new data to the site
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "Daily stats update $(date -u +%F)"
          # If the site changed while this was running, catch up first, keeping the new stats
          git pull --rebase -X theirs origin main
          git push
